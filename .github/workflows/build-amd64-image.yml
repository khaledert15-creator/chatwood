name: Build AMD64 production image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git commit SHA to build
        required: true
        default: 83cfd28208471f7035b31ddef19199f7610ece04
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: manual-amd64-image-build
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/khaledert15-creator/chatwood
  IMAGE_TAG: 4.15.1-agent-performance-83cfd282

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Verify source commit
        shell: bash
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "Requested SHA: ${{ inputs.source_ref }}"
          echo "Actual SHA: ${ACTUAL_SHA}"
          if [ "${ACTUAL_SHA}" != "${{ inputs.source_ref }}" ]; then
            exit 1
          fi

      - name: Show build environment
        run: |
          uname -m
          nproc
          free -h
          df -h
          docker version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Publish build summary
        run: |
          {
            echo "## AMD64 image build"
            echo
            echo "- Source commit: \`${{ inputs.source_ref }}\`"
            echo "- Image name: \`${IMAGE_NAME}\`"
            echo "- Image tag: \`${IMAGE_TAG}\`"
            echo "- Image digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Platform: \`linux/amd64\`"
          } >> "$GITHUB_STEP_SUMMARY"
